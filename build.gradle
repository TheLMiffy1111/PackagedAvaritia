plugins {
	id "com.crystaelix.loom" version "1.11-SNAPSHOT"
	id "eclipse"
	id "idea"
	id "maven-publish"
	id "com.crystaelix.blossom" version "1.3.2"
	id "me.modmuss50.mod-publish-plugin" version "1.0.0"
}

repositories {
	mavenCentral()
	flatDir {
		dirs "libs"
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.parchmentmc.net/"
			}
		}
		filter {
			includeGroup "org.parchmentmc.data"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.crystaelix.com/releases/"
			}
		}
		filter {
			includeGroup "thelm.packagedauto"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.blamejared.com/"
			}
		}
		filter {
			includeGroup "mezz.jei"
			includeGroup "vazkii.patchouli"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://cursemaven.com/"
			}
		}
		filter {
			includeGroup "curse.maven"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://modmaven.dev/"
			}
		}
		filter {
			includeGroup "appeng"
			includeGroup "mekanism"
		}
	}
}

def mcVersion = "1.18.2"
def modName = "PackagedAvaritia-Re"
def modId = "packagedavaritia"
def specVersion = "2"
def vendor = "thelm"

group = "thelm.packagedavaritia"
version = "2.0.1.2"

def archivesName = "${modName}-${mcVersion}"
base.archivesName = archivesName

sourceSets {
	main
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
		vendor = JvmVendorSpec.AZUL
	}
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
}

loom {
	silentMojangMappingsLicense()
	runs {
		configureEach {
			property "fabric.log.console.level", "debug"
		}
		client
		server
	}
}

dependencies {
	// Log4j
	implementation "org.apache.logging.log4j:log4j-core:2.24.3"

	// Minecraft
	minecraft "com.mojang:minecraft:1.18.2"
	mappings loom.layered {
		officialMojangMappings()
		parchment "org.parchmentmc.data:parchment-1.18.2:2022.11.06@zip"
	}
	forge "net.minecraftforge:forge:1.18.2-40.3.11"

	// Dependencies
	modImplementation "thelm.packagedauto:PackagedAuto-1.18.2:3.1.17.65"
	modImplementation "curse.maven:re-avaritia-623969:3866842"
	modImplementation("mezz.jei:jei-1.18.2-forge:10.2.1.1009") {transitive = false}
	modImplementation "appeng:appliedenergistics2-forge:11.7.6"
	modImplementation "vazkii.patchouli:Patchouli:1.18.2-71.1"

	// Testing
	modImplementation "mekanism:Mekanism:1.18.2-10.2.5.465"
	modImplementation "curse.maven:applied-mekanistics-574300:3968835"

	// Performance
	modImplementation "curse.maven:yeetusexperimentus-635427:4377180"
	implementation "io.github.llamalad7:mixinextras-forge:0.5.0"
	modImplementation "curse.maven:modernfix-790626:5399365"
	modImplementation "curse.maven:ferritecore-429235:4074294"
	modImplementation "curse.maven:lazy-dfu-forge-460819:3544496"
}

def replacements = [
	"0@VERSION@": version
]

blossom {
	replaceToken(replacements)
}

processResources {
	inputs.properties(replacements)
	filesMatching(["mcmod.info", "META-INF/mods.toml", "META-INF/neoforge.mods.toml", "fabric.mod.json"]) {
		filter {
			it.replace(replacements)
		}
	}
}

def manifestAttributes = [
	"Specification-Title": modName,
	"Specification-Vendor": vendor,
	"Specification-Version": specVersion,
	"Implementation-Title": archivesName,
	"Implementation-Version": version,
	"Implementation-Vendor": vendor
]

jar {
	manifest.attributes(manifestAttributes)
}

sourcesJar {
	manifest.attributes(manifestAttributes)
}

publishing {
	publications {
		register("mavenJava", MavenPublication) {
			artifactId = archivesName
			artifact remapJar
			artifact sourcesJar
		}
	}
	repositories {
		if(project.hasProperty("CrystaelixMavenUsername") && project.hasProperty("CrystaelixMavenPassword")) {
			maven {
				name = "CrystaelixMaven"
				url = "https://maven.crystaelix.com/releases/"
				credentials(PasswordCredentials)
			}
		}
	}
}

publishMods {
	file = remapJar.archiveFile
	version = displayName = "${mcVersion}-Re-${project.version}"
	changelog = file("changelog.md").text
	type = BETA
	modLoaders.add("forge")
	additionalFiles.from(sourcesJar.archiveFile)

	curseforge {
		accessToken = providers.gradleProperty("curseforge.token")
		projectId = "308383"
		minecraftVersions.add(mcVersion)
		requires "packagedauto", "re-avaritia"
		optional "applied-energistics-2"
		incompatible "avaritia-1-10", "avaritia-universal", "avaritia1-2x"
	}

	modrinth {
		accessToken = providers.gradleProperty("modrinth.token")
		projectId = "aA94MQL4"
		minecraftVersions.add(mcVersion)
		requires "packagedauto", "re-avaritia"
		optional "ae2"
	}
}
